    <script>
    (function(){
    const canvas = document.getElementById('nebula-canvas');
    const gl = canvas.getContext('webgl');
    if (!gl) return;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(resLoc, canvas.width, canvas.height);
    }

    const vs = `attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
    const fs = `
    precision mediump float;
    uniform float t;
    uniform vec2 res;

    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float hash2(vec2 p){return fract(sin(dot(p,vec2(269.5,183.3)))*43758.5453);}

    float noise(vec2 p){
    vec2 i=floor(p),f=fract(p);
    vec2 u=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),
                mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
    }
    float fbm(vec2 p){
    float v=0.0,a=0.5;
    for(int i=0;i<6;i++){v+=a*noise(p);p=p*2.1+vec2(1.3,0.7);a*=0.5;}
    return v;
    }

    float star(vec2 uv, float grid, float threshold, float size){
    vec2 cell=floor(uv*grid);
    vec2 local=fract(uv*grid)-0.5;
    float rng=hash(cell);
    if(rng<threshold) return 0.0;
    vec2 offset=vec2(hash2(cell)-0.5, hash(cell+vec2(7.3,2.1))-0.5)*0.6;
    float d=length(local-offset);
    return smoothstep(size, 0.0, d);
    }

    void main(){
    vec2 uv=(gl_FragCoord.xy/res)*2.0-1.0;
    uv.x*=res.x/res.y;
    float s=t*0.035;

    vec2 q=vec2(fbm(uv+s),fbm(uv+vec2(1.7,9.2)+s*0.8));
    vec2 r=vec2(fbm(uv+1.5*q+vec2(1.7,9.2)+s*0.5),
                fbm(uv+1.5*q+vec2(8.3,2.8)+s*0.3));
    float f=fbm(uv+1.5*r);

    vec3 col=vec3(0.01,0.01,0.06);
    col=mix(col, vec3(0.1,0.03,0.22), clamp(f*2.5,0.0,1.0));
    col=mix(col, vec3(0.0,0.2,0.35), clamp(f*f*3.5,0.0,1.0));
    col=mix(col, vec3(0.15,0.35,0.55), clamp(pow(f,6.0)*4.0,0.0,1.0));

    float s1=star(uv, 80.0, 0.92, 0.04);
    col+=vec3(0.7,0.8,1.0)*s1*0.9;

    float s2=star(uv, 200.0, 0.96, 0.018);
    col+=vec3(0.5,0.6,0.9)*s2*0.5;

    float s3=star(uv, 400.0, 0.975, 0.01);
    col+=vec3(0.4,0.5,0.8)*s3*0.3;

    float v=1.0-length(uv)*0.45;
    col*=max(v,0.0);

    gl_FragColor=vec4(col,1.0);
    }`;

    function mkShader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s); return s;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog); gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
    const pLoc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(pLoc);
    gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

    const tLoc = gl.getUniformLocation(prog, 't');
    const resLoc = gl.getUniformLocation(prog, 'res');
    resize();
    window.addEventListener('resize', resize);

    const start = Date.now();
    function loop() {
        gl.uniform1f(tLoc, (Date.now() - start) / 1000);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(loop);
    }
    loop();
    })();
    </script>
